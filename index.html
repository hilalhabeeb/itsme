<html lang="en" class="scroll-smooth">

    <style>
      :root {
        --accent: #06b6d4;
        --accent-glow: rgba(6, 182, 212, 0.5);
      }
      * {
        -webkit-tap-highlight-color: transparent;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        background-color: #020617;
        color: #f8fafc;
        overflow-x: hidden;
      }
      .glass {
        background: rgba(15, 23, 42, 0.6);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      .text-glow {
        text-shadow: 0 0 20px var(--accent-glow);
      }
      .card-3d {
        transition: transform 0.4s cubic-bezier(0.2, 0, 0, 1);
        transform-style: preserve-3d;
      }
      @media (hover: hover) {
        .card-3d:hover {
          transform: perspective(1000px) rotateX(4deg) rotateY(4deg) translateZ(10px);
        }
      }
      @keyframes float {
        0%, 100% { transform: translateY(0) rotate(0); }
        50% { transform: translateY(-15px) rotate(1deg); }
      }
      .animate-float {
        animation: float 8s ease-in-out infinite;
      }
      .grid-bg {
        background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,0.03) 1px, transparent 0);
        background-size: 32px 32px;
      }
      .hide-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      .hide-scrollbar::-webkit-scrollbar {
        display: none;
      }
      section[id] { scroll-margin-top: 110px; }
      a:focus-visible, button:focus-visible { outline: 2px solid #22d3ee; outline-offset: 5px; }
      .skip-link { position: fixed; top: -100px; left: 20px; z-index: 100; padding: 12px 20px; background: white; color: #020617; border-radius: 10px; }
      .skip-link:focus { top: 15px; }
      .wtc-art { position: relative; min-height: 300px; height: 100%; overflow: hidden; background: radial-gradient(ellipse at 50% 70%, #164e63 0%, #0f172a 55%, #020617 100%); }
      .wtc-halo { position: absolute; width: 250px; height: 250px; border: 1px solid #22d3ee22; border-radius: 50%; top: 15%; left: calc(50% - 125px); box-shadow: 0 0 90px #22d3ee11; }
      .wtc-tower { position: absolute; height: 75%; width: 28%; bottom: 12%; background: repeating-linear-gradient(0deg, transparent 0 6px, #94a3b844 7px 8px), linear-gradient(100deg, #64748b, #164e63 55%, #38bdf8); }
      .wtc-left { left: 17%; clip-path: polygon(100% 0, 100% 100%, 0 100%, 9% 76%, 26% 48%, 60% 17%); }
      .wtc-right { right: 17%; clip-path: polygon(0 0, 0 100%, 100% 100%, 91% 76%, 74% 48%, 40% 17%); }
      .wtc-bridge { position: absolute; left: 41%; width: 18%; height: 3px; background: #94a3b8; display: flex; align-items: center; justify-content: center; }
      .wtc-rotor { width: 34px; height: 34px; color: #f1f5f9; filter: drop-shadow(0 0 8px #22d3ee88); }
      @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; } }
      /* Fluid Breakpoints */
      @media (max-width: 400px) {
        .xs\:block { display: block; }
      }
      /* Custom Selection */
      ::selection {
        background: rgba(6, 182, 212, 0.3);
        color: white;
      }
    </style>

</head>
