
<!DOCTYPE html>
<html lang="en" className="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>HILAL HABEEB | Software Architect Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
      :root {
        --accent: #06b6d4;
        --accent-glow: rgba(6, 182, 212, 0.5);
      }
      * {
        -webkit-tap-highlight-color: transparent;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        background-color: #020617;
        color: #f8fafc;
        overflow-x: hidden;
      }
      .glass {
        background: rgba(15, 23, 42, 0.6);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      .text-glow {
        text-shadow: 0 0 20px var(--accent-glow);
      }
      .card-3d {
        transition: transform 0.4s cubic-bezier(0.2, 0, 0, 1);
        transform-style: preserve-3d;
      }
      @media (hover: hover) {
        .card-3d:hover {
          transform: perspective(1000px) rotateX(4deg) rotateY(4deg) translateZ(10px);
        }
      }
      @keyframes float {
        0%, 100% { transform: translateY(0) rotate(0); }
        50% { transform: translateY(-15px) rotate(1deg); }
      }
      .animate-float {
        animation: float 8s ease-in-out infinite;
      }
      .grid-bg {
        background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,0.03) 1px, transparent 0);
        background-size: 32px 32px;
      }
      /* Fluid Breakpoints */
      @media (max-width: 400px) {
        .xs\:block { display: block; }
      }
      /* Custom Selection */
      ::selection {
        background: rgba(6, 182, 212, 0.3);
        color: white;
      }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@^19.2.3",
        "react-dom": "https://esm.sh/react-dom@^19.2.3",
        "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
        "react/": "https://esm.sh/react@^19.2.3/",
        "framer-motion": "https://esm.sh/framer-motion@^11.11.11",
        "lucide-react": "https://esm.sh/lucide-react@^0.454.0",
        "@google/genai": "https://esm.sh/@google/genai@^1.34.0"
      }
    }
    </script>
  <link rel="stylesheet" href="/index.css">
</head>
  <body class="grid-bg">
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
